name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # stdlib-only by design; the suite is the Rust port's math + SQL
      # surface + regressions + schema agreement, and runs in ~1s.
      - run: python tests/test_rfm.py
