[package]
name = "sqlite-rfm"
version = "0.1.0"
edition = "2021"
description = "RFM-scored agent memory as a SQLite extension: ACT-R activation (recency+frequency) plus outcome-feedback value"
license = "MIT OR Apache-2.0"

[lib]
# Artifact must be librfm.dylib so `.load ./librfm` resolves entrypoint sqlite3_rfm_init.
name = "rfm"
crate-type = ["cdylib", "lib"]

[dependencies]
# 0.0.5 lacks sqlite3ext_context_db_handle and the prepare/step/bind wrappers; pin exact.
sqlite-loadable = "=0.0.6-alpha.6"

[profile.release]
debug = false
strip = true
